name: Manifest

# Keeps latest.json in this branch equal to the newest published release's.
# Battery Hub reads it through api.github.com, which serves it directly:
# release downloads are redirected to release-assets.githubusercontent.com,
# which some networks stall on for many seconds.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy latest.json from the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p latest.json --clobber
          node -e "const m=require('./latest.json'); if (!m.version || !m.platforms) process.exit(1)"
          if git diff --quiet -- latest.json 2>/dev/null && git ls-files --error-unmatch latest.json >/dev/null 2>&1; then
            echo "latest.json already matches $tag"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "latest.json for $tag"
          git push
